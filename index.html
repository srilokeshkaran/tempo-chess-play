[hidden]{display:none!important}
.carve{fill:none;stroke:var(--incision);stroke-width:1.5;stroke-linecap:round}

.desk-intro{margin:0 0 24px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filters button{padding:6px 12px;border-radius:6px;border:1px solid var(--rule);font-size:.84rem}
.filters button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.course-grid,.coach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lesson-card,.coach-box,.coach-hero{background:#fdfdf8;border:1px solid var(--rule);border-radius:9px;padding:19px}
.lesson-card{display:flex;gap:12px;text-align:left;align-items:flex-start;position:relative}.lesson-card:hover{background:#f0f3e7;border-color:#aebfa5}
.lesson-symbol{display:grid;place-items:center;width:33px;height:36px;background:#ecf0df;color:#506c4c;border-radius:6px;flex:none}
.lesson-card strong,.lesson-card small,.lesson-card>span>span{display:block}
.lesson-card small,.review-row small,.phase-metric small,.coach-hero small{font-size:.75rem;color:var(--muted)}
.lesson-card strong{font:400 1.62rem/1.2 "Instrument Serif",Georgia,serif;margin:3px 0 5px}.lesson-card .done{position:absolute;right:10px;top:9px}
.coach-grid{align-items:start}.coach-hero{background:#234939;color:#fff9e9;border-color:#234939}.coach-hero .mini-title{color:#ccdbbc}.coach-hero p,.coach-hero small{color:#e1e6d6}
.coach-grid h2{font:400 1.85rem/1.12 "Instrument Serif",Georgia,serif;margin:0 0 10px}.coach-hero h2{font-size:2.45rem;margin-top:9px}
.coach-hero .primary{margin-top:15px;color:#244335;background:#f2eed8}.coach-box p{margin:4px 0 11px}
.check-progress,.challenge-track{display:flex;gap:5px;margin:15px 0 5px}.check-progress span,.challenge-track span{height:5px;border-radius:4px;flex:1;background:#597260}
.check-progress span.filled{background:#e1ca88}.challenge-track span{background:#dbdfd0}.challenge-track span.filled{background:#578157}
.phase-metric{padding:7px 0}.phase-metric>div{display:flex;align-items:center;justify-content:space-between;font-size:.85rem}.phase-metric progress{width:100%;height:7px;accent-color:#578157;display:block;margin:6px 0 2px}

.plan-step strong,.review-row strong{font-size:.9rem}.plan-step p,.review-row p{margin:3px 0}.review-row small{display:block}.review-row{justify-content:space-between}.review-row .text-btn{flex:none}
.coach-box details{font-size:.79rem;border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}.coach-box summary{cursor:pointer;font-weight:650}
.mini-board{display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:5px;max-width:278px;margin:0 auto 14px}
.mini-board span{display:block;aspect-ratio:1;background:var(--light)}.mini-board span.shade{background:var(--dark)}.note-card .text-btn{margin-top:8px}

@media(max-width:595px){.course-grid{grid-template-columns:1fr}.desk-intro{margin-bottom:16px}.main-nav>div:last-child{gap:0}.main-nav button{width:32px}}

function positionKey(fen){return fen.split(' ').slice(0,4).join(' ');}
function samePositionCount(positions,fen){const key=positionKey(fen);return positions.filter(f=>positionKey(f)===key).length;}
function outcome(g,positions){if(g.isCheckmate())return {title:sideName(g.turn()==='w'?'b':'w')+' wins',reason:'Checkmate',score:g.turn()==='w'?'0-1':'1-0'};let reason='';if(g.isStalemate())reason='Stalemate';else if(g.isInsufficientMaterial())reason='Insufficient material';else if(samePositionCount(positions,g.fen())>=5)reason='Fivefold repetition';else if(Number(g.fen().split(' ')[4])>=150)reason='75-move rule';return reason?{title:'Draw',reason,score:'1/2-1/2'}:null;}
function claimReason(g){if(g.isThreefoldRepetition())return 'Threefold repetition';if(g.isDrawByFiftyMoves())return '50-move rule';return '';}
function claimOptions(g,positions){const now=claimReason(g);if(now)return [{san:'',reason:now}];const seen=new Set();let repeated=false;for(const fen of positions){const key=positionKey(fen);if(seen.has(key))repeated=true;seen.add(key);}if(!repeated&&Number(g.fen().split(' ')[4])<99)return [];const claims=[];for(const san of g.moves()){g.move(san);const reason=claimReason(g);g.undo();if(reason)claims.push({san,reason});}return claims;}

function knock(at,pitch,strength,length){
  const ctx=audioContext;
  const oscillator=ctx.createOscillator(),gain=ctx.createGain();
  oscillator.type='sine';oscillator.frequency.setValueAtTime(pitch,at);oscillator.frequency.exponentialRampToValueAtTime(pitch*.47,at+length);
  gain.gain.setValueAtTime(.001,at);gain.gain.exponentialRampToValueAtTime(strength,at+.002);
  gain.gain.exponentialRampToValueAtTime(.001,at+length);oscillator.connect(gain);gain.connect(ctx.destination);
  oscillator.start(at);oscillator.stop(at+length+.004);
  const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.026),ctx.sampleRate),samples=buf.getChannelData(0);
  for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/(samples.length*.14));
  const noise=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),noiseGain=ctx.createGain();
  filter.type='bandpass';filter.frequency.value=pitch*5;filter.Q.value=.85;noiseGain.gain.value=strength*.95;
  noise.buffer=buf;noise.connect(filter);filter.connect(noiseGain);noiseGain.connect(ctx.destination);noise.start(at);
}
function moveSound(move,delay=0){
  if(!state.prefs.sound||!audioContext||audioContext.state!=='running')return;
  const at=audioContext.currentTime+.005+delay/1000;
  if(move.captured){knock(at,675,.24,.043);knock(at+.037,265,.44,.085);}
  else if(move.san.startsWith('O-O')){knock(at,455,.31,.067);knock(at+.073,330,.3,.07);}
  else knock(at,395,.34,.069);

}

 function finish(report){
   reviewWorker?.terminate();reviewWorker=null;reviewBusyId=null;
   const current=state.records.find(x=>x.id===r.id);
   if(current===r){if(Array.isArray(report)&&report.length===r.sample.length){r.report=report;delete r.error;}else r.error=true;}

 $('transport').innerHTML='<div class="tgroup">'+action('flip','flip','Flip board',state.view==='live'&&state.live.mode==='pass')+'</div><div class="tgroup">'+(isPuzzle?'<span class="move-count">Puzzle '+(state.puzzleIndex+1)+' of '+puzzles.length+'</span>':action('first','first','First position',atStart)+action('prev','prev','Previous move',atStart)+action('autoplay',autoplay?'pause':'play',autoplay?'Pause replay':'Play replay',!data.moves.length,'play')+action('next','next','Next move',atEnd)+action('last','last','Latest position',atEnd))+'</div><span class="move-count">'+(isPuzzle?'Mate in 1':ply+' / '+data.moves.length)+'</span>';
}
function detailsView(){
 const study=state.view==='study',s=activeStudy(),l=state.live;
 const facts=study?[['Study',s.kind],['Opening',s.opening],['Setting',s.place],['Result',s.result==='*'?'Opening line':'White wins']]:[['Opponent',l.mode==='computer'?'Tempo computer':'Local player'],['Time control','Untimed'],['Draws','Claim at 3 repetitions or 50 moves'],['Result',viewResult()?.reason||'In progress']];
 return '<div class="details"><dl>'+facts.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+escapeHtml(v)+'</dd></div>').join('')+'</dl></div>';
}
function renderPanel(){
 if(state.view==='puzzle'){
  $('panel').innerHTML='<div class="score-title"><h2>'+icon('bolt')+'Tactics set</h2><span class="badge">'+state.solved.length+' / '+puzzles.length+'</span></div><div class="puzzle-list">'+puzzles.map((p,i)=>'<button data-act="puzzle" data-arg="'+i+'" class="'+(i===state.puzzleIndex?'on':'')+'">'+p.title+'<small>'+(state.solved.includes(i)?'Solved':'Mate in 1')+'</small></button>').join('')+'</div>';return;
 }
 const study=state.view==='study',result=study?activeStudy().result:viewResult()?.score;
 const history=data.moves,rows=[];
 for(const [i,m] of history.entries()){
   const n=Number(m.before.split(' ')[5]);if(!rows.length||rows[rows.length-1].n!==n)rows.push({n});rows[rows.length-1][m.color]={m,i};
 }
 const scoreHtml=rows.map(row=>'<div class="score-row"><span class="num">'+row.n+'.</span>'+['w','b'].map(c=>{const cell=row[c];return cell?'<button data-act="jump" data-arg="'+(cell.i+1)+'"'+(ply===cell.i+1?' class="current" aria-current="step"':'')+'>'+cell.m.san+'</button>':'<span></span>';}).join('')+'</div>').join('');
 const panel=$('panel'),oldScroll=panel.querySelector('.rows')?.scrollTop||0;
 panel.innerHTML='<div class="score-title"><h2>'+icon('score')+'Game score</h2>'+(result&&result!=='*'?'<span class="badge">'+result+'</span>':'')+'</div><div class="tabs"><button data-act="moves" class="'+(tabName==='moves'?'on':'')+'">Moves</button><button data-act="details" class="'+(tabName==='details'?'on':'')+'">Game info</button>'+(study?'<button data-act="studies" class="mobile-library">Library</button>':'')+'</div>'+(tabName==='moves'?'<div class="score-head"><span>#</span><span>WHITE</span><span>BLACK</span></div><div class="rows">'+(scoreHtml||'<div class="empty">Make the first move to start your scoresheet.</div>')+'</div>':detailsView())+'<div class="score-foot"><span>'+rows.length+' move'+(rows.length===1?'':'s')+'</span><button class="text-btn" data-act="pgn">'+icon('download')+'Export PGN</button></div>';
 const scroller=panel.querySelector('.rows'),current=scroller?.querySelector('.current');
 if(scroller){scroller.scrollTop=oldScroll;if(current){const a=current.getBoundingClientRect(),b=scroller.getBoundingClientRect();if(a.bottom>b.bottom)scroller.scrollTop+=a.bottom-b.bottom+4;if(a.top<b.top)scroller.scrollTop+=a.top-b.top-4;}}
}
function renderNote(){
 if(challenge){challengePanel();return;}
 let label='Study note',heading,body,extra='';
 if(state.view==='study'){
   const s=activeStudy();let note=s.notes[ply];
   if(!note){const move=data.moves[ply-1];note=[move.san+' · '+sideName(move.color)+'’s move',move.san.includes('+')?'The king is in check. Follow the next move to see how the defender responds.':move.captured?'The '+pieceName[move.piece]+' captures on '+move.to+'. Compare the remaining defenders before continuing.':'The '+pieceName[move.piece]+' moves from '+move.from+' to '+move.to+'. Look for the squares it now controls.'];}
   [heading,body]=note;extra='<button class="text-btn" data-act="challenge">'+icon('bolt')+'Try the move challenge</button>';
 }else if(state.view==='puzzle'){
   label='Tactical objective';heading=puzzleMove?'Checkmate found':sideName(game.turn())+' to move';body=puzzleMove?puzzles[state.puzzleIndex].lesson:puzzleMessage||'Find a legal move that checkmates the opposing king in one.';
 }else{
   const result=viewResult();label='Game status';
   if(ply!==data.moves.length){heading='Reviewing the game';body='Use the playback controls to study earlier moves. Return to the live position to continue playing.';}
   else if(result){heading=result.title;body=result.reason+'.';if(state.live.mode==='computer')extra='<button class="text-btn" data-act="coach">See my review and plan</button>';}
   else{heading=game.isCheck()?sideName(game.turn())+' is in check':(worker?'Computer is thinking':sideName(game.turn())+' to move');body=game.isCheck()?'Answer the check by moving the king, capturing the attacker, or blocking its attack.':state.live.mode==='computer'&&game.turn()!==state.live.side?'Tempo is choosing a legal reply.':'Click or drag a piece to its destination. Select a piece to see its legal moves.';
     if(!worker&&(state.live.mode!=='computer'||game.turn()===state.live.side)&&claimOptions(liveGame,data.positions).length)extra='<button class="text-btn" data-act="claim">Claim draw</button>';}
 }
 $('note').innerHTML='<div class="note-label">'+icon(state.view==='study'?'bulb':state.view==='puzzle'?'bolt':'rook')+label.toUpperCase()+'</div><h3>'+escapeHtml(heading)+'</h3><p>'+escapeHtml(body)+'</p>'+extra;
}
function showDialog(title,body){
 stopPlay();renderTransport();priorFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;
 if(!$('dialog').open)$('dialog').showModal();
}
function closeDialog(){if($('dialog').open)$('dialog').close();promotionRequest=null;}
function newDialog(seed=null,move=null){
 setupSeed=seed?{line:data.moves.slice(0,ply).map(m=>m.san),fen:data.positions[0],name:activeStudy().title+' practice',move}:null;
 const playing=state.live?.line.length>state.live?.startPly;
 showDialog(seed?'Practice this position':'New game','<p class="dialog-copy">'+(seed?'Continue from the position on the study board.':'Set up an untimed game on this device.')+(playing?' Starting replaces your current practice game.':'')+'</p><label class="field">Opponent<select id="mode"><option value="computer">Tempo computer</option><option value="local">Two players, one device</option><option value="pass">Pass and play · flip each turn</option></select></label><div id="computer-options"><label class="field">Play as<select id="side"><option value="w">White</option><option value="b">Black</option></select></label><label class="field">Computer strength<select id="level"><option value="casual">Casual</option><option value="club" selected>Club</option><option value="deep">Challenging</option></select></label></div><div class="dialog-actions"><button class="outline" data-act="close">Cancel</button><button class="primary" data-act="start">Start game</button></div>');
 if(seed)$('side').value=game.turn();
}
function startGame(){
 const seed=setupSeed,mode=$('mode').value,side=$('side').value,level=$('level').value,base=seed?.line||[];
 state.live={id:newId(),mode,side,level,fen:seed?.fen||DEFAULT_POSITION,line:[...base],startPly:base.length,seedName:seed?.name||'',claim:null};
 if(seed?.move){const g=replay(base,state.live.fen);if(mode!=='computer'||side===g.turn()){g.move(seed.move);state.live.line.push(seed.move);}}
 state.view='live';state.flipped=mode==='computer'&&side==='b';setupSeed=null;closeDialog();loadView();
}
function commitLive(san,drop=false){
 const followingLive=ply===data.moves.length;
 const move=liveGame.move(san);state.live.line.push(move.san);data.moves.push(move);data.positions.push(liveGame.fen());
 if(followingLive){ply=data.moves.length;clearSelection();stopPlay();render({move,drop:drop||state.live.mode==='pass'});}
 else render();
 recordFinish();save();announce(move.san+'. '+(viewResult()?.title||sideName(liveGame.turn())+' to move'));scheduleComputer();
}
function scheduleComputer(){
 if(state.view!=='live'||!state.live||worker||state.live.mode!=='computer'||liveGame.turn()===state.live.side||viewResult())return;
 const expected=liveGame.fen(),payload={line:[...state.live.line],fen:state.live.fen,level:state.live.level};
 const source=$('rule-source').textContent+'\n'+$('engine-source').textContent;
 let url;
 const fallback=()=>{if(state.view==='live'&&liveGame.fen()===expected&&!viewResult()){const moves=liveGame.moves();if(moves.length)commitLive(moves.find(s=>s.endsWith('#'))||moves[0]);}};
 try{
   url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));worker=new Worker(url);const current=worker;
   current.onmessage=({data:reply})=>{if(worker!==current)return;stopWorker();if(state.view!=='live'||liveGame.fen()!==expected)return;if(liveGame.moves().includes(reply.san))commitLive(reply.san);else fallback();};
   current.onerror=()=>{if(worker!==current)return;stopWorker();fallback();};current.postMessage(payload);
   $('top-player').innerHTML=player(sideAtBottom()==='w'?'b':'w');$('bottom-player').innerHTML=player(sideAtBottom());renderNote();
 }catch{stopWorker();fallback();}finally{if(url)URL.revokeObjectURL(url);}
}
function canUndo(){if(!state.live||state.live.checkIndex!=null)return false;const l=state.live;const since=data.moves.slice(l.startPly);return !!l.claim||(l.mode==='computer'?since.some(m=>m.color===l.side):since.length>0);}
function undo(){
 if(!canUndo())return;stopWorker();const l=state.live;state.records=state.records.filter(r=>r.id!==l.id);
 if(l.claim){l.claim=null;loadView();return;}
 do{l.line.pop();liveGame.undo();}while(l.mode==='computer'&&liveGame.turn()!==l.side&&l.line.length>l.startPly);
 loadView();announce('Move taken back.');
}
function attempt(sq,drop=false){
 const candidates=targets.filter(m=>m.to===sq);
 if(!candidates.length){if(drop){clearSelection();renderBoard();announce('Illegal destination.');}return;}
 if(candidates.length>1){promotionRequest={candidates,drop};showDialog('Promote your pawn','<div class="promotion">'+candidates.map(m=>'<button data-act="promote" data-arg="'+m.promotion+'" aria-label="Promote to '+pieceName[m.promotion]+'">'+pieceSvg(game.turn(),m.promotion)+'<small>'+pieceName[m.promotion]+'</small></button>').join('')+'</div>');return;}
 playCandidate(candidates[0],drop);
}
function playCandidate(m,drop){
 if(challenge){tryBookMove(m,drop);return;}
 if(state.view==='study'){
   if(data.moves[ply]?.san===m.san){jump(ply+1);return;}
   newDialog(true,m.san);return;
 }
 if(state.view==='puzzle'){
   const trial=new Chess(data.positions[0]);const move=trial.move(m.san);clearSelection();
   if(!trial.isCheckmate()){puzzleMessage='That move is legal, but the king still has a reply. Try another move.';render();announce(puzzleMessage);return;}
   puzzleMove=move;data=makeScore([m.san],data.positions[0]);ply=1;
   if(!state.solved.includes(state.puzzleIndex))state.solved.push(state.puzzleIndex);
   save();render({move,drop});announce('Correct. Checkmate.');return;
 }
 if(isInteractive())commitLive(m.san,drop);
}
function tapSquare(sq){
 if(!isInteractive()){if(state.view==='live'&&ply!==data.moves.length)notify('Return to the live position to make a move.');return;}
 stopPlay();if(!challenge)renderTransport();
 if(chosen&&targets.some(m=>m.to===sq)){attempt(sq);return;}
 if(chosen===sq){clearSelection();renderBoard();return;}
 const p=game.get(sq);if(p?.color===game.turn()){selectSquare(sq);announce(sideName(p.color)+' '+pieceName[p.type]+' on '+sq+'. '+[...new Set(targets.map(m=>m.to))].join(', '));}
 else clearSelection();renderBoard();
}
function exportPgn(){
 const study=state.view==='study',s=activeStudy(),l=state.live,score=study?(s.result==='1–0'?'1-0':'*'):viewResult()?.score||'*';
 const g=replay(data.moves.map(m=>m.san),data.positions[0]);g.setHeader('Event',study?s.title:'Tempo practice');g.setHeader('White',study?s.white:l.mode==='computer'&&l.side==='b'?'Tempo computer':'Local player');g.setHeader('Black',study?s.black:l.mode==='computer'&&l.side==='w'?'Tempo computer':'Local player');g.setHeader('Result',score);
 if(study&&state.study==='opera'){g.setHeader('Site','Paris');g.setHeader('Date','1858.??.??');}
 const url=URL.createObjectURL(new Blob([g.pgn()+'\n'],{type:'application/x-chess-pgn'}));const a=document.createElement('a');a.href=url;a.download=(study?state.study:'tempo-game')+'.pgn';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function showSettings(){
 showDialog('Board settings','<div class="mini-title">PIECE SET</div><div class="piece-gallery">'+Object.entries(pieceSets).map(([id,name])=>'<button data-act="pieceSet" data-arg="'+id+'" aria-pressed="'+(state.prefs.pieces===id)+'">'+pieceSvg('w','n',id)+'<span>'+name+'</span></button>').join('')+'</div><label class="field">Board palette<select id="theme"><option value="sage">Club green</option><option value="walnut">Walnut</option></select></label>'+[['sound','Move sounds'],['motion','Piece animations'],['dots','Legal-move hints'],['coords','Board coordinates']].map(([id,label])=>'<label class="setting">'+label+'<input type="checkbox" data-pref="'+id+'" '+(state.prefs[id]?'checked':'')+'></label>').join('')+'<button class="text-btn" data-act="sample">'+icon('volume')+'Test move sound</button><p class="credits">Rules by chess.js. Piece artwork by Cburnett and Rfc1394, adapted by shaack and Tempo. <button data-act="licenses" class="text-btn">Licenses</button></p><div class="dialog-actions"><button data-act="close" class="primary">Done</button></div>');
 $('theme').value=state.prefs.theme;
}
function changeView(name,id){
 if(name==='study'&&id)state.study=id;
 if(name==='puzzle'&&id!==undefined){state.puzzleIndex=Number(id);state.flipped=new Chess(puzzleStart(state.puzzleIndex)).turn()==='b';}
 else if(name==='study')state.flipped=false;
 else if(name==='live')state.flipped=state.live.mode==='computer'&&state.live.side==='b';
 state.view=name;loadView();
}
function handleAction(act,arg){
 switch(act){
 case 'library':closeDialog();changeView('study',arg);break;
 case 'study':changeView('study');break;
 case 'live':if(state.live)changeView('live');else newDialog();break;
 case 'tactics':changeView('puzzle',state.puzzleIndex);break;
 case 'studies':case 'lessons':openLessons();break;
 case 'coach':openCoach();break;
 case 'filterLessons':libraryPhase=arg;openLessons();break;
 case 'setupCheck':setupCheck();break;
 case 'startCheck':startCheck(Number(arg));break;
 case 'reviewDecision':showDecision(arg);break;
 case 'retryReview':{const r=state.records.find(r=>r.id===arg);if(r){delete r.error;queueReview();openCoach();}break;}
 case 'challenge':beginChallenge();break;
 case 'endChallenge':challenge=null;clearSelection();render();break;
 case 'pieceSet':if(pieceSets[arg]){state.prefs.pieces=arg;save();render();showSettings();}break;
 case 'new':newDialog();break;
 case 'branch':newDialog(true);break;
 case 'start':startGame();break;
 case 'close':closeDialog();break;
 case 'promote':{const req=promotionRequest,m=req?.candidates.find(m=>m.promotion===arg);closeDialog();if(m)playCandidate(m,req.drop);break;}
 case 'flip':if(state.view==='live'&&state.live.mode==='pass')break;state.flipped=!state.flipped;clearSelection();save();render();break;
 case 'prev':jump(ply-1);break;
 case 'next':jump(ply+1);break;
 case 'first':jump(0);break;
 case 'last':case 'latest':jump(data.moves.length);break;
 case 'jump':jump(Number(arg));break;
 case 'autoplay':if(autoplay){stopPlay();renderTransport();}else if(data.moves.length){if(ply===data.moves.length)jump(0);autoplay=setInterval(()=>jump(ply+1,true),1250);renderTransport();}break;
 case 'moves':case 'details':tabName=act;renderPanel();break;
 case 'pgn':exportPgn();break;
 case 'undo':undo();break;
 case 'sound':state.prefs.sound=!state.prefs.sound;unlockAudio();save();render();if(state.prefs.sound)moveSound({san:''});break;
 case 'sample':if(state.prefs.sound){unlockAudio();moveSound({san:''});}else notify('Enable move sounds to hear the preview.');break;
 case 'settings':showSettings();break;
 case 'licenses':showDialog('Licenses','<pre style="white-space:pre-wrap;font-size:.75rem">'+escapeHtml($('license-text').textContent)+'</pre>');break;
 case 'shortcuts':showDialog('Keyboard shortcuts','<div class="setting">Previous / next position <span><kbd>←</kbd> <kbd>→</kbd></span></div><div class="setting">Flip board <kbd>F</kbd></div><div class="setting">Mute / enable sound <kbd>M</kbd></div><p class="credits">On the board, arrow keys move focus. Enter or Space selects a piece or destination. Escape clears the selection.</p>');break;
 case 'puzzle':changeView('puzzle',arg);break;
 case 'nextPuzzle':changeView('puzzle',(state.puzzleIndex+1)%puzzles.length);break;
 case 'hint':puzzleMessage=puzzles[state.puzzleIndex].hint;renderNote();announce(puzzleMessage);break;
 case 'claim':{const options=claimOptions(liveGame,data.positions);if(options.length)showDialog('Claim a draw','<div class="puzzle-list">'+options.map(o=>'<button data-act="confirmClaim" data-arg="'+o.san+'">'+(o.san?'Declare '+o.san:'Claim now')+'<small>'+o.reason+'</small></button>').join('')+'</div>');break;}
 case 'confirmClaim':{const option=claimOptions(liveGame,data.positions).find(o=>o.san===arg);if(option){state.live.claim={title:'Draw',reason:option.reason+(arg?' (declared '+arg+')':''),score:'1/2-1/2'};closeDialog();recordFinish();save();render();}break;}
 }
}
document.addEventListener('click',event=>{
 unlockAudio();const btn=event.target.closest('button');if(!btn||btn.disabled)return;
 if(btn.dataset.sq){if(suppressClick){suppressClick=false;return;}focusSquare=btn.dataset.sq;tapSquare(btn.dataset.sq);return;}
 if(btn.dataset.act)handleAction(btn.dataset.act,btn.dataset.arg??'');
});
document.addEventListener('change',e=>{
 if(e.target.id==='mode')$('computer-options').hidden=e.target.value!=='computer';
 if(e.target.id==='theme')state.prefs.theme=e.target.value;
 if(e.target.dataset.pref){state.prefs[e.target.dataset.pref]=e.target.checked;if(e.target.dataset.pref==='sound'&&e.target.checked){unlockAudio();moveSound({san:''});}}
 if(e.target.id==='theme'||e.target.dataset.pref){save();render();}
});
$('dialog').addEventListener('close',()=>{promotionRequest=null;if(priorFocus?.isConnected)priorFocus.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{
 if($('dialog').open||e.ctrlKey||e.metaKey||e.altKey)return;
 if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
 unlockAudio();const sq=e.target.closest('[data-sq]');
 if(sq&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
   e.preventDefault();const squares=[...$('board').children],n=squares.indexOf(sq),r=Math.floor(n/8),f=n%8;
   const dx=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,dy=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;
   const next=squares[Math.min(7,Math.max(0,r+dy))*8+Math.min(7,Math.max(0,f+dx))];sq.tabIndex=-1;next.tabIndex=0;focusSquare=next.dataset.sq;next.focus();return;
 }
 if(e.key==='Escape'){clearSelection();renderBoard();return;}
 if(e.key.toLowerCase()==='f')handleAction('flip');if(e.key.toLowerCase()==='m')handleAction('sound');
 if(!desk&&!challenge&&state.view!=='puzzle'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();jump(ply+(e.key==='ArrowLeft'?-1:1));}
});

document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));
listenOnBoard();
loadView();
